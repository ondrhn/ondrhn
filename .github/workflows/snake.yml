name: yilan
on:
  schedule:
    - cron: "0 */12 * * *"   # 12 saatte bir taze katki verisiyle yeniden ciz
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Yilan SVG uret (acik + koyu tema)
        uses: Platane/snk@v3
        with:
          github_user_name: ondrhn
          outputs: |
            dist/github-snake.svg?color_snake=%231e3a8a&color_dots=%23ebedf0,%23fff3bf,%23ffe066,%23fcc419,%23f08c00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%234263eb&color_dots=%23161b22,%235c4d00,%238f7a00,%23c9a800,%23ffd43b
      - name: output dalina yayinla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
